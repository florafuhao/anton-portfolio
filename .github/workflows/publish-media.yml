name: Publish portfolio media
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download split media package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/portfolio-parts
          gh release download media-v1 --pattern 'portfolio.part-*' --dir /tmp/portfolio-parts
          test "$(find /tmp/portfolio-parts -type f | wc -l)" -eq 8
          cat /tmp/portfolio-parts/portfolio.part-* > /tmp/Antony-portfolio-full.zip
          echo "0259154cbd21ac36d6e2a84c9225b29aa08c37406a578be3e9b7815a9181a7b2  /tmp/Antony-portfolio-full.zip" | sha256sum -c -
      - name: Extract package
        run: unzip -q /tmp/Antony-portfolio-full.zip -d /tmp/portfolio-package
      - name: Publish images
        run: |
          cp -a /tmp/portfolio-package/Antony-portfolio-full/assets/. assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "Add portfolio images"; git push; }
      - name: Publish original videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for file in /tmp/portfolio-package/Antony-portfolio-full/media/*; do
            gh release upload media-v1 "$file" --clobber
          done
